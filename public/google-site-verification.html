<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Google Site Verification</title>
  </head>
  <body>
    <!--
      Replace this file content with the HTML verification file provided
      by Google Search Console.

      Steps:
      1. Go to https://search.google.com/search-console
      2. Add your property (URL prefix: https://wearepeoplefirst.com)
      3. Choose "HTML file" verification method
      4. Download the verification file Google provides
      5. Replace this file with that downloaded file
      6. Deploy to Vercel
      7. Click "Verify" in Search Console

      The filename Google provides will be something like:
      google1234567890abcdef.html
      Rename this file to match that filename exactly.
    -->
    google-site-verification: googleXXXXXXXXXXXXXXXX.html
  </body>
</html>

content: |
  In recruiting, a signed offer is often treated as the end of the process. It is an important milestone, but it does not mark the end of the work. The new hire's first weeks largely determine whether the onboarding works and whether the initial expectations hold.

  ## Why does post-hire follow-up belong to the process?

  Onboarding problems often surface late, when nobody asks how the person is doing. Access that takes long to grant, an unclear first project or a team with a different pace than expected can create frustration within a few weeks. An early conversation makes it possible to detect these situations before they lead to an early departure.

  An illustrative case: a data engineer accepted an attractive offer but, during the first month, found that access to the data required approvals that took weeks. A follow-up at the ten-day mark allowed expectations to be reset with the technical lead and prevented the situation from becoming an early exit.

  ## What do onboarding conversations reveal?

  These conversations are also a source of learning for the process itself. They show what was communicated well during the search, which expectations were left incomplete and which aspects of the role should be described more precisely in the future.

  Recording that information and reviewing it between searches improves job descriptions, evaluation criteria and the way the opportunity is presented. Recruiting becomes more precise when each hire informs the next one.

  Hiring well does not end with the offer. Supporting the onboarding and listening to what the first weeks reveal is part of the same work.
contentEs: |
  En reclutamiento, la firma de una oferta suele tomarse como el cierre del proceso. Es un hito importante, pero no marca el final del trabajo. Las primeras semanas del nuevo integrante determinan en buena medida si la incorporación funciona y si la expectativa inicial se sostiene.

  ## ¿Por qué el seguimiento posterior a la contratación forma parte del proceso?

  Los problemas de onboarding suelen aparecer tarde cuando nadie pregunta cómo se siente la persona. Accesos que tardan en habilitarse, un primer proyecto poco claro o un equipo con ritmos distintos a los esperados pueden generar desgaste en pocas semanas. Una conversación temprana permite detectar esas situaciones antes de que deriven en una salida.

  Un caso ilustrativo: una ingeniera de datos aceptó una oferta atractiva, pero durante el primer mes descubrió que el acceso a los datos requería aprobaciones que demoraban semanas. Un seguimiento a los diez días permitió ajustar expectativas con el líder técnico y evitar que la situación se convirtiera en una salida anticipada.

  ## ¿Qué información aportan las conversaciones de onboarding?

  Esas conversaciones también son una fuente de aprendizaje para el propio proceso. Muestran qué se comunicó bien durante la búsqueda, qué expectativas quedaron incompletas y qué aspectos del puesto conviene describir con más precisión en el futuro.

  Registrar esa información y revisarla entre búsquedas permite mejorar las descripciones de puestos, los criterios de evaluación y la forma de presentar la oportunidad. El reclutamiento se vuelve más preciso cuando cada contratación alimenta la siguiente.

  Contratar bien no termina en la oferta. Acompañar la incorporación y escuchar lo que las primeras semanas revelan es parte del mismo trabajo.

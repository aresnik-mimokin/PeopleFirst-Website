content: |
  An engineer can meet every requirement of the role: the stack, the years of experience and the certifications. Even so, the outcome of a hire depends on factors a CV does not show clearly, such as how the person communicates, how they collaborate and the environment where they do their best work.

  ## What does a CV not reveal about how someone works?

  A CV describes technologies and responsibilities, but it rarely explains how someone communicates when a requirement changes mid-sprint or how they receive feedback on their code. It also does not indicate what they expect from their next team or which kind of leadership helps them perform.

  These dimensions shape integration in the first weeks and retention over the medium term. An illustrative case: a strong engineer left after two quarters because the team relied on asynchronous reviews and offered little visibility into priorities, something that had not come up during the search.

  ## How can compatibility be assessed without relying on subjective impressions?

  It helps to translate compatibility into observable behaviors. Asking for concrete examples, such as how the candidate resolved a technical disagreement, how they communicated a delay or what they did when scope changed, makes it possible to compare experiences rather than general impressions.

  Compatibility does not replace technical competence; it complements it. The goal is not only to find someone able to do the job, but someone who can grow within that particular team. When both dimensions are evaluated with clear criteria, hiring decisions are more consistent and rely less on intuition.
contentEs: |
  Las competencias técnicas son necesarias, pero la comunicación, la colaboración y el entorno determinan si la persona podrá desarrollarse en el equipo.

  Un ingeniero puede cumplir todos los requisitos del puesto: el stack, los años de experiencia y las certificaciones. Aun así, el resultado de la contratación depende de factores que un CV no muestra con claridad, como la forma de comunicarse, de colaborar y el entorno en el que esa persona rinde mejor.

  ## ¿Qué no muestra un CV sobre la forma de trabajar?

  Un CV describe tecnologías y responsabilidades, pero rara vez explica cómo alguien se comunica cuando un requerimiento cambia a mitad de sprint o cómo recibe una devolución sobre su código. Tampoco indica qué espera de su próximo equipo ni qué tipo de liderazgo le permite dar lo mejor de sí.

  Esas dimensiones influyen en la integración de las primeras semanas y en la permanencia a mediano plazo. Un caso ilustrativo: un ingeniero con una trayectoria técnica sólida abandonó su segundo trimestre porque el equipo trabajaba con revisiones asincrónicas y poca visibilidad de prioridades, algo que no había mencionado en la búsqueda.

  ## ¿Cómo evaluar la compatibilidad sin caer en la subjetividad?

  Conviene traducir la compatibilidad en comportamientos observables. Preguntar por ejemplos concretos, como cómo resolvió un desacuerdo técnico, cómo comunicó un retraso o qué hizo cuando el alcance cambió, permite comparar experiencias en lugar de impresiones generales.

  La compatibilidad no reemplaza la competencia técnica; la complementa. El objetivo no es solo encontrar a alguien capaz de hacer el trabajo, sino a alguien que pueda crecer dentro de ese equipo en particular. Cuando ambas dimensiones se evalúan con criterios claros, las decisiones de contratación son más consistentes y menos dependientes de la intuición.

content: |
  **Short answer:** every rejected candidate tells someone about your process. Those people may be future hires, referrers or customers. Rejecting well is part of hiring well, and it costs very little when it is planned.

  ## Tell candidates quickly

  Silence is the most common complaint candidates have about hiring processes. Send a decision as soon as you have one, even if it is a no. A clear answer in a few days builds more trust than a vague "we'll be in touch" after three weeks.

  ## Be direct and kind

  Say that the decision is no, thank them for their time, and keep the message short. Long explanations sound defensive, and a warm but clear rejection leaves the door open.

  ## Give specific feedback when you can

  When a candidate reached a late stage, a concrete point helps them more than a generic line. Focus on the role requirements, not on personal judgments, and keep it to one or two points they can act on.

  ## Keep the door open

  Strong candidates who weren't the right fit for this role can be right for the next one. Ask whether they want to stay in your talent pool, and follow up when a different role opens.

  ## Avoid the common mistakes

  Don't ghost late-stage candidates, don't reject someone by copying a template with the wrong name, and don't use a rejection to reopen a salary discussion. Each of these shows the candidate how the company will treat them as an employee.

  A respectful rejection protects the next search. At PeopleFirst Talent Partners, a boutique tech recruiting firm, we manage candidate communication end to end for startups and scale-ups hiring Engineering, Data and AI talent across LATAM, the US and Europe. More at https://wearepeoplefirst.com/
contentEs: |
  **Respuesta corta:** cada candidato rechazado le cuenta a alguien cómo fue tu proceso. Esas personas pueden ser futuras contrataciones, recomendadores o clientes. Rechazar bien también es parte de contratar bien, y cuesta muy poco cuando está planificado.

  ## Avisá rápido

  El silencio es la queja más común de los candidatos sobre los procesos de selección. Mandá una decisión apenas la tengas, aunque sea un no. Una respuesta clara en pocos días genera más confianza que un "te escribimos" vago después de tres semanas.

  ## Sé directo y amable

  Decí que la decisión es no, agradecé el tiempo y mantené el mensaje corto. Las explicaciones largas suenan a justificación, y un rechazo cálido pero claro deja la puerta abierta.

  ## Dá feedback concreto cuando puedas

  Si la persona llegó a una etapa avanzada, un punto concreto le sirve más que una frase genérica. Enfocate en los requisitos del rol, no en juicios personales, y limitate a uno o dos puntos que pueda trabajar.

  ## Dejá la puerta abierta

  Un candidato fuerte que no encajó en este rol puede encajar en el próximo. Preguntale si quiere seguir en tu banco de talento y escribile cuando se abra un puesto distinto.

  ## Evitá los errores comunes

  No hagas ghosting con candidatos de etapas avanzadas, no mandes una plantilla con el nombre equivocado y no uses el rechazo para reabrir la discusión salarial. Cada uno de estos casos le muestra al candidato cómo lo va a tratar la empresa como empleado.

  Un rechazo respetuoso protege la próxima búsqueda. En PeopleFirst Talent Partners, boutique de tech recruiting, gestionamos la comunicación con los candidatos de punta a punta para startups y scale-ups que contratan talento de Engineering, Data e IA en LATAM, US y Europa. Más información en https://wearepeoplefirst.com/

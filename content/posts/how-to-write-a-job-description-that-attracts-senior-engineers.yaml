content: |
  **Short answer:** senior engineers rarely apply to a list of tools. They read a job description to answer one question: what would I actually do here, and who would I work with? If the text answers that, it attracts the right people. If it doesn't, you get volume without fit.

  ## Start with the outcome, not the stack

  "Senior Backend Engineer with Go, Kubernetes and Kafka" tells a candidate what you use. It doesn't tell them what they will solve. Begin with the problem the hire owns, such as reducing payment failures or making the data platform reliable enough for finance to trust it. Then list the tools as context.

  ## Describe the first 90 days

  A strong candidate wants to know what success looks like early on. Write two or three concrete milestones for the first quarter. It shows you have thought about the role, and it helps candidates decide whether they could deliver it.

  ## Be honest about the team and the stage

  Say whether the company is post-Series A with a team of six, or a scale-up adding its third squad. Say who the person will report to and who they will work with. Senior candidates weigh the stage heavily, so vagueness reads as a risk.

  ## Show the process and the timeline

  Briefly outline the steps, the number of interviews and roughly how long the process takes. Candidates who are juggling other offers will drop out of a process they can't plan around.

  ## Put the pay range in the post

  A range makes the first conversation faster and filters out mismatched expectations early. It also signals that the company knows what the role is worth.

  ## Cut the must-have list

  Long lists of requirements discourage candidates who match most of the description but not every line, and those are often the strongest people. Keep three or four real must-haves and label the rest as nice to have.


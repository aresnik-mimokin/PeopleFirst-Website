contentEs: |
  **Respuesta corta:** los ingenieros senior casi nunca se postulan a una lista de herramientas. Leen una descripción de puesto para responder una pregunta: ¿qué haría yo realmente acá, y con quién trabajaría? Si el texto responde eso, atrae a las personas adecuadas. Si no, llega mucho volumen sin fit.

  ## Empezá por el resultado, no por el stack

  "Senior Backend Engineer con Go, Kubernetes y Kafka" le dice al candidato qué usás, pero no qué va a resolver. Empezá por el problema que la persona va a tener a cargo, por ejemplo reducir fallos en pagos o hacer que la plataforma de datos sea lo bastante confiable para que Finanzas la use. Después, las herramientas van como contexto.

  ## Describí los primeros 90 días

  Un candidato fuerte quiere saber cómo se ve el éxito temprano. Escribí dos o tres hitos concretos para el primer trimestre. Eso muestra que pensaste el rol y le ayuda a decidir si podría cumplirlo.

  ## Sé honesto con el equipo y la etapa

  Decí si la empresa está después de Series A con un equipo de seis personas, o si es un scale-up que suma su tercer squad. Indicá a quién reporta la persona y con quién va a trabajar. Los candidatos senior pesan mucho la etapa, y la vaguedad se lee como riesgo.

  ## Mostrá el proceso y los tiempos

  Resumí los pasos, la cantidad de entrevistas y cuánto más o menos dura el proceso. Quien tiene otras ofertas en curso se cae de un proceso que no puede planificar.

  ## Poné el rango salarial en la publicación

  Un rango acelera la primera conversación y filtra expectativas que no coinciden desde el principio. Además, muestra que la empresa sabe cuánto vale el rol.

  ## Recortá la lista de requisitos

  Las listas largas desaniman a candidatos que cumplen la mayoría de los puntos pero no todos, y muchas veces son las personas más fuertes. Dejá tres o cuatro requisitos reales y marcá el resto como deseable.


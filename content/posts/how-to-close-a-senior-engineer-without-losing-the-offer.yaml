content: |
  **Short answer:** most senior hires are lost after the final interview, not during it. The candidate loves the team, then waits a week for an offer, gets a competing one, and the momentum is gone. Closing is a process you design in advance.

  ## Find out what they are weighing before the offer

  Ask directly what matters most in the next role: scope, compensation, growth, remote flexibility, stage of the company. You can't write a strong offer without knowing what they are comparing you against.

  ## Move fast after the final interview

  Aim to send the offer within a few days of the last conversation. A slow offer tells a senior candidate that the company is not sure about them, even if it is.

  ## Make the offer complete

  Put scope, reporting line, compensation, equity if applicable, benefits and start date in writing. Vague offers create doubt, and doubt is what competing offers feed on.

  ## Prepare for the counteroffer before it happens

  Ask early what the candidate's current company would need to do to keep them. If the answer is "a raise," you know the decision is about more than money. Address the real reasons they are looking, such as growth or ownership, in the first conversation.

  ## Keep the candidate informed until the start date

  Stay in touch between signing and the first day. Introduce them to the team, share the onboarding plan and answer questions quickly. A candidate who feels part of the team before day one is far less likely to change their mind.


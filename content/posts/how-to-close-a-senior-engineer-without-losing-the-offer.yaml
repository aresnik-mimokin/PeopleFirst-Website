contentEs: |
  **Respuesta corta:** la mayoría de los ingenieros senior se pierde después de la entrevista final, no durante ella. La persona se entusiasma con el equipo, espera una semana por la oferta, recibe una competidora y el impulso se cae. Cerrar es un proceso que se diseña de antemano.

  ## Averiguá qué está comparando antes de la oferta

  Preguntá directamente qué pesa más en el próximo rol: alcance, compensación, crecimiento, flexibilidad remota, etapa de la empresa. No podés armar una oferta sólida sin saber contra qué te está comparando.

  ## Movete rápido después de la entrevista final

  Apuntá a enviar la oferta a los pocos días de la última conversación. Una oferta lenta le dice a un candidato senior que la empresa no está segura de él, aunque sí lo esté.

  ## Hacé una oferta completa

  Escribí por escrito alcance, reporte, compensación, equity si aplica, beneficios y fecha de inicio. Las ofertas vagas generan dudas, y las dudas son lo que alimentan una oferta competidora.

  ## Preparate para la contraoferta antes de que llegue

  Preguntá temprano qué tendría que hacer su empresa actual para retenerlo. Si la respuesta es "un aumento", sabés que la decisión es más que plata. Atendé los motivos reales por los que busca, como crecimiento o ownership, desde la primera conversación.

  ## Mantené al candidato informado hasta el primer día

  Seguí en contacto entre la firma y el inicio. Presentalo al equipo, compartí el plan de onboarding y respondé preguntas rápido. Quien se siente parte del equipo antes del día uno tiene mucho menos chances de cambiar de opinión.


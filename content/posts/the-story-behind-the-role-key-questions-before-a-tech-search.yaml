content: |
  Two startups can be looking for exactly the same Software Engineer and still have very different needs. The technical requirements may be identical, while team dynamics, expectations and the working environment are not. That is why, before sourcing begins, it is worth understanding the story behind the opening.

  ## Which questions should be answered before starting a search?

  A few questions set the starting point: why the company is hiring now, what problem the person will help solve, who they will work with and what success looks like after six months. The answers change the profile. An engineer who must stabilize a legacy payments system is not the same as one who builds a product from scratch, even if both are titled "Senior Software Engineer".

  An illustrative case: a company opened an engineering role to "accelerate the roadmap". On closer review, technical leadership needed to resolve debt in a critical database, while the product area expected new features. Aligning those two views before publishing prevented a three-month process that would have addressed neither need.

  ## Why does context change the candidate assessment?

  When context is clear, evaluation becomes more precise. Interview questions target the role's real problems, and candidates can decide with concrete information whether the opportunity interests them.

  Understanding the business does not require knowing every detail. It requires clarity about the priorities of the coming months and about the environment in which the person will work, including pace, how decisions are made and the level of autonomy expected. That initial clarity usually saves time in every stage that follows.
contentEs: |
  Dos startups pueden estar buscando exactamente el mismo Software Engineer y, aun así, tener necesidades muy diferentes. Los requisitos técnicos pueden ser idénticos, mientras que la dinámica del equipo, las expectativas y el entorno de trabajo no lo son. Por eso, antes de hacer sourcing, conviene entender la historia detrás de la vacante.

  ## ¿Qué preguntas conviene responder antes de empezar a buscar?

  Algunas preguntas ordenan el punto de partida: por qué se contrata ahora, qué problema resolverá la persona, con quién trabajará y qué significará el éxito a los seis meses. Las respuestas cambian el perfil. Un ingeniero que debe estabilizar un sistema de pagos heredado no es el mismo que el que construye un producto desde cero, aunque ambos figuren como "Senior Software Engineer".

  Un caso ilustrativo: una empresa abrió una vacante de ingeniería para "acelerar el roadmap". Al profundizar, el liderazgo técnico necesitaba resolver deuda en una base de datos crítica, y el área de producto esperaba nuevas funcionalidades. Alinear esas dos visiones antes de publicar evitó un proceso de tres meses que no habría cubierto ninguna de las dos necesidades.

  ## ¿Por qué el contexto cambia la evaluación del candidato?

  Cuando el contexto está claro, la evaluación se vuelve más precisa. Las preguntas de entrevista apuntan a los problemas reales del puesto, y el candidato puede decidir con información concreta si la propuesta le interesa.

  Entender el negocio no implica conocer todos sus detalles. Implica tener claridad sobre las prioridades de los próximos meses y sobre el entorno en el que la persona va a trabajar, incluidos el ritmo, la forma de tomar decisiones y el grado de autonomía esperado. Esa claridad inicial suele ahorrar tiempo en todas las etapas que siguen.

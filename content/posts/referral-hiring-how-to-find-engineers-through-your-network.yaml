contentEs: |
  **Respuesta corta:** los referidos funcionan porque la confianza ya existe. Un buen ingeniero que recomienda a alguien pone su reputación en juego, así que la primera conversación arranca desde un lugar más fuerte. El detalle es que los referidos solo escalan si el proceso alrededor está claro.

  ## Pedí perfiles concretos a tu equipo

  "Mandennos a alguien bueno" no produce nada. Describí el rol como se lo contarías a un amigo: el problema, el stack en contexto, la etapa de la empresa. La gente solo puede recomendar a candidatos que se imagina.

  ## Hacé que recomendar sea fácil y rápido

  Dales a los ingenieros un formulario corto o un solo contacto para enviar nombres. Confirmá la recepción y contales qué pasó con la persona que recomendaron. Si nunca reciben respuesta, dejan de recomendar.

  ## Tratá a los referidos como a cualquier candidato

  Un referido es una señal fuerte, no un atajo. Hacé la misma evaluación que con todos, para que el nivel se mantenga y el equipo no sienta presión de bajarlo por el amigo de un amigo.

  ## Cerrá el ciclo con quien recomendó

  Agradecé a quien recomendó y mantenelo al tanto mientras avanza el proceso. Los referidos crecen cuando la gente siente que su recomendación se tomó en serio, contrate o no.

  ## Sabé dónde se acaban los referidos

  Tu red tiene límites. Rara vez cubre varios roles senior a la vez, perfiles especializados como AdTech o ML en producción, ni contrataciones en un país nuevo. Ahí es donde un partner especializado llega a lugares que tu equipo solo no alcanza.


content: |
  **Short answer:** referrals work because trust is already there. A good engineer who recommends someone is putting their reputation on the line, so the first conversation starts from a stronger place. The catch is that referrals only scale if the process around them is clear.

  ## Ask your team for specific profiles

  "Send us anyone good" produces nothing. Describe the role the way you would describe it to a friend: the problem, the stack in context, the stage of the company. People can only refer candidates they can picture.

  ## Make it easy and fast to refer

  Give engineers a short form or a single contact to send names to. Confirm receipt, and tell them what happened to the candidate they referred. Engineers stop referring when they never hear back.

  ## Treat referred candidates like any other

  A referral is a strong signal, not a shortcut. Run the same evaluation as for every candidate, so the bar stays consistent and the team doesn't feel pressure to lower it for a friend of a friend.

  ## Close the loop with the referrer

  Thank the person who referred, and keep them updated while the process runs. Referrals grow when people feel their recommendation was taken seriously, whether or not the hire happens.

  ## Know where referrals stop

  Your network has limits. It rarely covers several senior roles at once, specialized profiles such as AdTech or ML in production, or hiring in a new country. That is where a specialized partner adds coverage your team can't reach on its own.


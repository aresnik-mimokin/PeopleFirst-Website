content: >
  Three years ago, any tech company that didn’t offer remote work was losing
  talent. Startups competed to be **“100% flexible.”**


  Today, that message has changed dramatically, especially in the United States.


  The pendulum has shifted, but **not in the same way everywhere**.


  ## **The Shift Was Abrupt in the U.S.**


  Companies that allowed fully remote work during the pandemic began pushing
  employees back to the office.


  Meta announced mandatory RTO (Return to Office) policies. Amazon, Apple,
  Google, and other major tech companies also adjusted their policies toward
  greater in-person presence.


  Even startups that were born remote now require **3–4 days in the office** or
  have abandoned flexibility altogether.


  When a tech company in Silicon Valley says a role is “remote,” it can
  sometimes mean hybrid — with only one or two days of work-from-home per week.


  The shift has been significant enough that startups that once hired remotely
  across the country are now narrowing their geographic reach to cities where
  they can require in-person work.


  The reasoning is consistent: **company culture, cross-team collaboration, and
  more effective onboarding for junior employees**.


  But the pattern is clear: the U.S. is moving back toward the office, and that
  has real implications for how companies hire talent.


  An engineer in Denver can no longer assume they can work fully remotely for a
  startup in San Francisco the way they could in 2022.


  ## **In LATAM, the Movement Is More Cautious and Nuanced**


  Companies see the value of having people in the office — productivity,
  culture, and faster decision-making — but they’re moving more carefully.


  They know that requiring employees to be on-site means reducing access to a
  talent pool that remote work opened up.


  A talented engineer in Mendoza isn’t necessarily going to move to Buenos Aires
  for one job opportunity.


  A company in Mexico City with a presence across five cities can’t ignore the
  fact that remote work was often the only way to fill critical positions.


  The result is a **gradual return to the office**.


  Many LATAM startups are experimenting with flexible hybrid models: **2–3 days
  in the office and the rest remote**.


  Others with distributed teams remain fully remote but provide coworking
  options in certain cities.


  Some larger tech companies in LATAM are returning to the office while keeping
  hiring within their existing regional footprint — Buenos Aires with Buenos
  Aires, Mexico with Mexico — to avoid sacrificing access to talent.


  ## **What Does This Mean for Hiring?**


  In the U.S., remote talent is negotiating from a smaller pool of opportunities
  than it did a few years ago. Many of the strongest positions now require some
  degree of in-person presence.


  In LATAM, talent still has access to genuine remote opportunities, but fewer
  than two years ago.


  Companies are becoming more selective about which roles can remain remote:
  execution-focused positions may require more presence, while **architecture,
  research, and specialist roles** can often remain remote.


  The interesting part is that this divergence creates an opportunity for LATAM
  companies that are willing to embrace remote hiring.


  While some U.S. companies are narrowing their talent pools through in-office
  requirements, LATAM companies can continue accessing remote talent and attract
  candidates who may no longer have the same options in the U.S.


  But that requires being honest and clear about the offer.


  **100% remote work is becoming increasingly rare. Flexible hybrid is the new
  reality.**


  Companies that understand this shift now can position themselves more
  effectively in an increasingly competitive talent market.


  **Carla Costantini, Global Talent Partner at PeopleFirst Agency**
contentEs: >
  Hace tres años, cualquier empresa tech que no ofreciera trabajo remoto perdía
  talento. Las startups competían por ser "100% flexible." **Hoy ese mensaje
  cambió de manera drástica, especialmente en Estados Unidos**. El péndulo se
  movió, pero no igual en todas partes.


  ## **El cambio fue abrupto en EEUU**


  Empresas que durante pandemia permitieron trabajo completamente remoto
  comenzaron a impulsar regresos a la oficina. 

  **Meta anunció RTO (Return to Office) obligatorio. Amazon, Apple, Google y
  otras grandes tech ajustaron políticas hacia presencialidad**. Incluso
  startups que nacieron remoto ahora requieren 3-4 días en oficina o abandonan
  la flexibilidad por completo. 


  Cuando una empresa tech en Silicon Valley ofrece trabajo "remoto", en realidad
  dice híbrido con una o dos veces home office por semana. El cambio fue tan
  marcado que startups que contrataban remotamente a nivel nacional ahora
  reducen su geographical reach a ciudades donde pueden exigir presencialidad.


  La justificación es consistente: **cultura de empresa, innovación cross-team,
  onboarding más efectivos**.

  El patrón es claro. Estados Unidos está regresando a la oficina, y eso tiene
  implicaciones reales en cómo contratan talento. Un engineer en Denver ya no
  puede trabajar remoto puro para una startup en San Francisco como lo hacía en
  2022.


  ## **En LATAM el movimiento es opuesto: cauteloso y matizado** 


  Las empresas ven el valor de tener gente en oficina: productividad, cultura,
  decisiones más rápidas, pero avanzan con cuidado. 


  Saben que exigir presencialidad significa cerrar acceso a un pool de talento
  que el trabajo remoto abrió. Un engineer talentoso en Mendoza no se va a mudar
  a Buenos Aires solo por una posición. Una empresa en Ciudad de México con
  presencia en cinco ciudades no puede ignorar que el remoto fue la única forma
  de llenar posiciones críticas.


  El resultado es un **regreso paulatino, de a poco**. 


  Muchas startups LATAM están experimentando un híbrido flexible: 2-3 días en
  oficina, el resto remoto. Otras con presencia distribuida mantienen full
  remoto pero piden co-working en algunas ciudades. Algunas grandes empresas
  tech en LATAM regresan a la presencialidad pero dentro de su misma región
  (Buenos Aires con Buenos Aires, México con México) para no sacrificar talento.


  ## **¿Qué significa esto para hiring?** 


  En EEUU, si sos talento remoto estás negociando desde debilidad. Las mejores
  posiciones exigen presencialidad o cuasi-presencialidad. El pool se achicó. 


  En LATAM, el talento sigue teniendo opciones remotas reales, pero menos que
  hace dos años. Las empresas están siendo más selectivas sobre dónde permiten
  el trabajo remoto: posiciones de ejecución necesitan más presencia;
  arquitectura, research y roles de especialista mantienen el remoto.


  **El trabajo remoto 100% es cada vez más raro. Híbrido flexible es la nueva
  realidad**. 


  **Quien lo entienda ahora tiene ventaja competitiva**


  **Carla Costantini, Global Talent Partner at PeopleFirst Agency**

content: >
  “Remote-first” is still everywhere on LinkedIn.


  But if you look at what companies are actually offering, the picture is
  becoming much more nuanced.


  Remote work existed in tech long before the pandemic, especially in
  engineering teams used to working across countries and time zones. What
  changed after 2020 wasn’t the existence of remote work — it was how widely
  companies were willing to offer it.


  Today, the market seems to be moving in different directions depending on the
  company, the role, and the region.


  ## **Two Markets, Two Speeds**


  In the US, many startups and scaleups have been moving toward more
  office-based models. Some are going back to fully on-site environments, while
  others are introducing hybrid models with several days per week in the office.


  In LATAM, the shift has generally been more gradual.


  Hybrid models remain common, with companies often combining two or three
  office days with remote work. There is still more flexibility than in many
  US-based companies, but less than there was a few years ago.


  The result is not a simple move from remote to office.


  It’s a market with **different speeds, different expectations, and
  increasingly role-specific policies.**


  ## **Why Companies Are Pushing People Back to the Office**


  The arguments are familiar:


  * **Culture and team cohesion**

  * **Faster collaboration and problem-solving**

  * **Knowledge sharing**

  * **Onboarding and learning**

  * **Retention and connection**

  * **Easier coordination across teams**


  For some companies, being together in person is seen as a way to improve how
  teams operate.


  And there are situations where physical proximity can genuinely make certain
  things easier: resolving complex problems, transferring knowledge, building
  relationships, or getting a new team member up to speed.


  But there is another side to the equation.


  ## **Flexibility Expands the Talent Pool**


  Every additional office requirement changes the candidate pool.


  A company asking for five days in the office is competing for a very different
  group of candidates than one offering fully remote work.


  And this becomes even more relevant for **senior and highly specialized
  talent**.


  The right candidate might live in another city. Or another country.


  They might already have a setup that works extremely well for them. They might
  not be willing to relocate — or accept a long commute — simply because a
  company decided that everyone should be in the office.


  So the question isn’t only:


  **“What work model do we prefer?”**


  It’s also:


  **“What talent are we willing to exclude because of that decision?”**


  ## **Office Presence Can Solve Some Problems — But Creates Others**


  There is a real trade-off here.


  More in-person interaction can help with collaboration, culture, and certain
  types of knowledge transfer.


  But less flexibility can also mean:


  * A smaller talent pool

  * More geographic restrictions

  * Longer hiring timelines

  * More difficulty hiring specialized profiles

  * Candidates dropping out of processes because of location requirements


  For companies hiring in competitive tech markets, **the work model is part of
  the hiring strategy.**


  It directly affects who enters your funnel in the first place.


  ## **The Role Should Influence the Model**


  One of the biggest mistakes is treating the work model as a company-wide
  decision that applies equally to every role.


  But not every role operates in the same way.


  A senior engineer working independently across a distributed team may have
  very different needs from a junior employee who requires intensive onboarding
  and mentorship.


  A highly collaborative Product role may benefit from more in-person
  interaction than a deeply focused individual contributor role.


  The right question may not be:


  **“Are we remote-first or office-first?”**


  It may be:


  **“What working model allows this specific team to perform at its best — while
  still giving us access to the talent we need?”**


  That distinction matters.


  ## **The Real Cost of “Just One More Office Day”**


  From a hiring perspective, an extra office day might seem like a small change.


  But candidates don't experience it in isolation.


  One additional day can mean:


  * A longer commute

  * Higher transportation costs

  * Less flexibility

  * Different childcare or family logistics

  * Being unable to apply from another location


  And for a candidate who has multiple opportunities, those details can
  influence whether they enter or stay in a hiring process.


  **The work model is part of the candidate experience.**


  It can influence both attraction and retention.


  ## **So, Is Remote-First Disappearing?**


  Not necessarily.


  What seems to be changing is the idea that one model works for everyone.


  Some companies are moving toward more office presence. Others remain fully
  remote. Many are landing somewhere in between.


  And candidates are adapting too.


  For hiring teams, the important thing is to understand the trade-off instead
  of treating remote vs. office as an ideological debate.


  **More office presence may support certain cultural or collaboration goals.
  More flexibility may expand access to talent.**


  Neither decision exists in a vacuum.


  The real question is whether your hiring strategy is aligned with the talent
  you actually need to attract.


  At **PeopleFirst**, we help companies think about work models not just as an
  internal policy, but as part of their talent strategy — especially when hiring
  Engineering, Data, and AI profiles across LATAM, the US, and Europe.


  **Carla Costantini, Global Talent Partner at PeopleFirst Talent Partners**
contentEs: >
  En LinkedIn, **“remote-first”** sigue apareciendo por todos lados.


  En la práctica, el mercado se está moviendo en otra dirección —y cada vez con
  más matices.


  El trabajo remoto en tech no es un invento de la pandemia. Los equipos
  distribuidos de Engineering ya trabajaban de manera remota mucho antes de
  2020.


  Lo que cambió no es si trabajar remoto es posible.


  Es **cuánto están dispuestas las empresas a ofrecerlo sin condiciones.**


  ## **Dos mercados, dos velocidades**


  En startups y scaleups de Estados Unidos, el regreso a modelos más
  presenciales ha sido significativo. En algunos casos, las empresas pasaron
  directamente de remoto a presencial sin adoptar un modelo híbrido como
  solución permanente.


  Cuando existe un esquema híbrido, la presencialidad puede seguir ocupando la
  mayor parte de la semana.


  El full remote, mientras tanto, está siendo tratado cada vez más como una
  estrategia específica de hiring y no necesariamente como el default.


  En LATAM, el movimiento es más gradual y heterogéneo.


  Los modelos híbridos están ganando terreno, muchas veces con dos o tres días
  de oficina y el resto remoto. Eso todavía representa una flexibilidad mayor
  que la que ofrecen muchas empresas estadounidenses, aunque también supone un
  cambio respecto de la flexibilidad remota que muchas compañías ofrecían
  algunos años atrás.


  El punto importante es que **no existe un único mercado global de trabajo
  remoto.**


  Las políticas internas, las expectativas de los candidatos, la infraestructura
  de oficinas, el mercado laboral y la cultura de cada empresa influyen en qué
  significa realmente ser “flexible”.


  ## **Por qué las empresas están empujando hacia la oficina**


  Los argumentos suelen repetirse:


  * Cultura y cohesión de equipo

  * Colaboración más rápida

  * Transferencia de conocimiento

  * Comunicación más directa

  * Potencialmente, menor rotación


  La idea detrás de esto es que determinadas actividades pueden beneficiarse de
  la interacción presencial: calibrar un equipo, resolver un incidente de
  producción, hacer onboarding o transferir contexto que resulta difícil
  documentar.


  Pero existe otra consecuencia que muchas veces queda menos visible:


  **el pool de talento se achica.**


  Cuantas más restricciones geográficas incorporás, menos candidatos podés
  considerar realmente.


  Un ML Engineer o Staff Engineer con mucha experiencia que hoy trabaja remoto
  desde otra ciudad puede no estar dispuesto a mudarse —o sumar varios días de
  oficina por semana— para aceptar una nueva oportunidad.


  Y ahí aparece la tensión real detrás del debate remoto vs. presencial.


  No es simplemente una discusión sobre productividad o preferencias personales.


  Es un **trade-off entre distintos objetivos de hiring.**


  ## **La flexibilidad amplía el pool de talento**


  Contratar de manera remota permite acceder a un mercado geográfico más amplio.


  Esto puede ser particularmente relevante para perfiles técnicos
  especializados, donde la oferta local de candidatos con experiencia es
  limitada.


  Una empresa que contrata en distintas ciudades o países puede llegar a
  candidatos que nunca consideraría bajo una política estrictamente localizada.


  Pero ampliar el acceso también trae complejidad.


  Time zones.


  Comunicación.


  Onboarding.


  Rituales de equipo.


  Management.


  Compensaciones.


  El remote hiring no elimina los desafíos operativos.


  **Cambia cuáles son los desafíos que tenés que resolver.**


  ## **La presencialidad puede resolver algunos problemas —pero crea otros**


  Lo mismo ocurre en sentido contrario.


  Un equipo más concentrado geográficamente puede facilitar determinadas formas
  de colaboración. Pero también reduce la flexibilidad geográfica.


  Para los equipos de Talent, esto genera una pregunta mucho más útil:


  **¿Qué estás optimizando con tu modelo de trabajo?**


  Si la respuesta es cultura, ¿qué parte de esa cultura requiere realmente
  presencialidad?


  Si es colaboración, ¿qué interacciones se benefician concretamente de estar en
  la misma oficina?


  Si es acceso a talento, ¿qué roles podrían abrirse geográficamente?


  Y si la respuesta es las tres, ¿cuáles son realmente no negociables?


  Estas preguntas son más útiles que simplemente definir a una empresa como
  “remote-first” u “office-first”.


  ## **El rol también debería influir en el modelo**


  No todos los roles necesitan el mismo esquema de trabajo.


  Un equipo que trabaja con infraestructura física tiene restricciones muy
  diferentes a las de un equipo de software distribuido.


  Incluso dentro de Engineering, el modelo puede variar según el tipo de
  trabajo, la etapa del equipo, el manager y cuánto cross-functional
  collaboration requiere el rol.


  Por eso, el modelo de trabajo puede pensarse como una **variable de hiring**,
  no solamente como una política de HR.


  Para algunos roles, exigir presencialidad puede tener sentido.


  Para otros, puede eliminar candidatos calificados antes de que siquiera entren
  en el proceso.


  La clave está en entender el trade-off de manera deliberada.


  ## **El costo real de “un día más de oficina”**


  Para una empresa, sumar un día obligatorio de oficina puede parecer un cambio
  menor.


  Para un candidato, puede cambiar completamente la oportunidad.


  Un día adicional de commute puede implicar:


  * Un salario mínimo diferente para considerar la posición

  * Un radio geográfico más limitado

  * Menos candidatos dispuestos a aplicar

  * Candidatos abandonando el proceso

  * Convertir la relocalización en un requisito


  Por eso, las decisiones sobre modalidad de trabajo deberían analizarse junto
  con compensación, ubicación, seniority y disponibilidad de talento.


  No son variables independientes.


  **Interactúan entre sí.**


  ## **Entonces, ¿está desapareciendo el remote-first?**


  No necesariamente.


  Lo que parece estar cambiando es la definición de flexibilidad.


  El mercado se está alejando de una discusión binaria:


  **Remoto vs. oficina.**


  La conversación más útil es:


  **¿Qué modelo de trabajo tiene sentido para este equipo, este rol y esta etapa
  de la empresa, y qué implica esa decisión para el pool de talento
  disponible?**


  Las empresas no necesariamente tienen que elegir entre cultura fuerte y acceso
  a talento.


  Pero sí necesitan reconocer que cada restricción tiene un costo.


  La pregunta no es si remoto o presencial es universalmente mejor.


  **Es si la estrategia de hiring está alineada con el talento que la empresa
  realmente necesita atraer.**


  **Carla Costantini, Global Talent Partner at PeopleFirst Talent Partners**

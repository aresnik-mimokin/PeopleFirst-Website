problem:
  title: The Friction in Scaling High-Impact Teams
  subtitle: >-
    Growing tech companies face three consistent bottlenecks when building
    engineering teams.
  card1Title: Limited Talent Availability
  card1Description: >-
    Top-tier AI and engineering talent is rare — and heavily competed for. The
    candidates you need aren't browsing job boards.
  card2Title: Misaligned Technical Depth
  card2Description: >-
    Generic recruiters can't evaluate technical fit. You spend weeks
    interviewing the wrong profiles, burning your team's time and momentum.
  card3Title: Cost of Slow Velocity
  card3Description: >-
    Every week without the right hire delays product, slows growth, and puts
    mounting pressure on the rest of your team.
